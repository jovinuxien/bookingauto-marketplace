spring:
  application:
    name: booking-marketplace
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1026}
  datasource:
    # The marketplace database. Cal has its own, deliberately separate: sharing
    # one would make it far too easy to write availability from both sides.
    url: jdbc:postgresql://localhost:5443/marketplace
    username: market
    password: ${MARKET_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

marketplace:
  cal:
    # Reads: availability, from the web image.
    base-url: ${MARKETPLACE_CAL_BASE_URL:http://localhost:3000}

    # Cal's database, read-only, for importing what a salon set up in Cal's UI
    # (ADR 0010). Defaulted to the same CAL_DB_PASSWORD that docker-compose and
    # .env already carry -- it previously defaulted to empty, which meant the
    # application could not start at all unless the operator happened to export
    # a variable documented nowhere.
    datasource:
      url: ${MARKETPLACE_CAL_DATASOURCE_URL:jdbc:postgresql://localhost:5442/calendso}
      username: ${MARKETPLACE_CAL_DATASOURCE_USERNAME:cal}
      password: ${MARKETPLACE_CAL_DATASOURCE_PASSWORD:${CAL_DB_PASSWORD:}}

    # Writes: confirm and cancel, from api-v2.
    #
    # Separate because they are separate deployments, not because it is tidy.
    # The web image serves a public booking-create endpoint and no
    # authenticated confirm or cancel, so the funnel's compensations live here
    # and nowhere else. Leave this blank and confirm/cancel throw rather than
    # no-op — a cancellation reported but not performed strands a real slot.
    # Defaulted to what docker-compose publishes. api-v2 is part of the stack
    # now, so requiring this to be set by hand only produced funnels that could
    # reserve and not cancel.
    api-v2-url: ${MARKETPLACE_CAL_API_V2_URL:http://localhost:3001}
    api-key: ${MARKETPLACE_CAL_API_KEY:}

    webhook-secret: ${MARKETPLACE_CAL_WEBHOOK_SECRET:}
    timezone: Europe/Stockholm

  # Basis points, frozen onto each attempt at quote time so a rate change
  # cannot retroactively alter a sale already in flight.
  commission-bps: 1500

  payments:
    # 'dev' moves no money. Never set this anywhere real.
    gateway: ${MARKETPLACE_PAYMENTS_GATEWAY:dev}
    stripe:
      api-key: ${MARKETPLACE_PAYMENTS_STRIPE_API_KEY:}
      # Point at stripe-mock to exercise request shapes without credentials.
      # Blank means the real Stripe.
      base-url: ${MARKETPLACE_PAYMENTS_STRIPE_BASE_URL:}
      webhook-secret: ${MARKETPLACE_PAYMENTS_STRIPE_WEBHOOK_SECRET:}
      methods: swish,card

  notifications:
    # SMTP by default, at spring.mail.host -- which itself defaults to
    # localhost, where docker-compose runs MailHog.
    #
    # The earlier default of 'log' was safe and useless: notifications appeared
    # to be broken because nothing ever arrived. Defaulting to SMTP is safe for
    # the reason that matters -- localhost has no relay in production, so a
    # misconfigured deployment fails loudly into the outbox and retries, and
    # reaching real customers still requires deliberately pointing MAIL_HOST at
    # a real server. Set 'log' to silence delivery entirely.
    transport: ${MARKETPLACE_NOTIFICATIONS_TRANSPORT:smtp}
    from: ${MARKETPLACE_NOTIFICATIONS_FROM:no-reply@example.se}
    interval-ms: ${MARKETPLACE_NOTIFICATIONS_INTERVAL_MS:15000}
    max-attempts: 8

  checkout:
    # Nobody sends a webhook for a customer who simply walked away, so this is
    # what returns their slot. Errs long: reselling a slot someone has just paid
    # for is far worse than holding one a few minutes too many.
    abandon-after-seconds: ${MARKETPLACE_CHECKOUT_ABANDON_AFTER_SECONDS:900}
    sweep-interval-ms: ${MARKETPLACE_CHECKOUT_SWEEP_INTERVAL_MS:60000}

server:
  port: 8090

logging:
  level:
    se.marketplace: DEBUG
