spring:
  application:
    name: booking-marketplace
  ai:
    # Read only when marketplace.ai.enabled is true, but declared with a blank
    # default so an absent key is a feature that stays off rather than a
    # backend that will not start.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1026}
  datasource:
    # The marketplace database. Cal has its own, deliberately separate: sharing
    # one would make it far too easy to write availability from both sides.
    url: jdbc:postgresql://localhost:5443/marketplace
    username: market
    password: ${MARKET_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

marketplace:
  cal:
    # Reads: availability, from the web image.
    base-url: ${MARKETPLACE_CAL_BASE_URL:http://localhost:3000}

    # Cal's database, read-only, for importing what a salon set up in Cal's UI
    # (ADR 0010). Defaulted to the same CAL_DB_PASSWORD that docker-compose and
    # .env already carry -- it previously defaulted to empty, which meant the
    # application could not start at all unless the operator happened to export
    # a variable documented nowhere.
    datasource:
      url: ${MARKETPLACE_CAL_DATASOURCE_URL:jdbc:postgresql://localhost:5442/calendso}
      username: ${MARKETPLACE_CAL_DATASOURCE_USERNAME:cal}
      password: ${MARKETPLACE_CAL_DATASOURCE_PASSWORD:${CAL_DB_PASSWORD:}}

    # Writes: confirm and cancel, from api-v2.
    #
    # Separate because they are separate deployments, not because it is tidy.
    # The web image serves a public booking-create endpoint and no
    # authenticated confirm or cancel, so the funnel's compensations live here
    # and nowhere else. Leave this blank and confirm/cancel throw rather than
    # no-op — a cancellation reported but not performed strands a real slot.
    # Defaulted to what docker-compose publishes. api-v2 is part of the stack
    # now, so requiring this to be set by hand only produced funnels that could
    # reserve and not cancel.
    api-v2-url: ${MARKETPLACE_CAL_API_V2_URL:http://localhost:3001}
    api-key: ${MARKETPLACE_CAL_API_KEY:}

    webhook-secret: ${MARKETPLACE_CAL_WEBHOOK_SECRET:}
    timezone: Europe/Stockholm

  # Where this deployment is reachable, used in the links we email out. A
  # verification link pointing at localhost arrives in a real inbox and cannot
  # be clicked, which is the kind of failure nothing in the system can detect.
  public-url: ${MARKETPLACE_PUBLIC_URL:http://localhost:8090}

  # Basis points, frozen onto each attempt at quote time so a rate change
  # cannot retroactively alter a sale already in flight.
  commission-bps: 1500

  payments:
    # 'dev' moves no money. Never set this anywhere real.
    gateway: ${MARKETPLACE_PAYMENTS_GATEWAY:dev}
    stripe:
      api-key: ${MARKETPLACE_PAYMENTS_STRIPE_API_KEY:}
      # Point at stripe-mock to exercise request shapes without credentials.
      # Blank means the real Stripe.
      base-url: ${MARKETPLACE_PAYMENTS_STRIPE_BASE_URL:}
      webhook-secret: ${MARKETPLACE_PAYMENTS_STRIPE_WEBHOOK_SECRET:}
      methods: swish,card

  notifications:
    # SMTP by default, at spring.mail.host -- which itself defaults to
    # localhost, where docker-compose runs MailHog.
    #
    # The earlier default of 'log' was safe and useless: notifications appeared
    # to be broken because nothing ever arrived. Defaulting to SMTP is safe for
    # the reason that matters -- localhost has no relay in production, so a
    # misconfigured deployment fails loudly into the outbox and retries, and
    # reaching real customers still requires deliberately pointing MAIL_HOST at
    # a real server. Set 'log' to silence delivery entirely.
    transport: ${MARKETPLACE_NOTIFICATIONS_TRANSPORT:smtp}
    from: ${MARKETPLACE_NOTIFICATIONS_FROM:no-reply@example.se}
    interval-ms: ${MARKETPLACE_NOTIFICATIONS_INTERVAL_MS:15000}
    max-attempts: 8

  signup:
    # How long the verification link works. A day is long enough for someone who
    # registered in the evening and read their email at work; much longer and it
    # is a live credential sitting in a mailbox.
    token-ttl-hours: ${MARKETPLACE_SIGNUP_TOKEN_TTL_HOURS:24}

    # Per hour, per source. Generous for a person and useless for a script:
    # what these defend is Cal and Stripe, which is why the numbers are small
    # even though the endpoint itself is cheap to serve.
    #
    # The IP limit is the loose one on purpose -- it is counted before the form
    # is validated, so a person mistyping a postal code several times must not
    # lock themselves out for an hour. A shared office address is also one IP.
    per-ip-per-hour: ${MARKETPLACE_SIGNUP_PER_IP_PER_HOUR:10}
    per-email-per-hour: ${MARKETPLACE_SIGNUP_PER_EMAIL_PER_HOUR:3}

    # Higher, and about a different thing. Guessing a 256-bit token is not a
    # strategy, so this is only there to stop someone using the endpoint as a
    # way to generate load.
    verify-per-ip-per-hour: ${MARKETPLACE_SIGNUP_VERIFY_PER_IP_PER_HOUR:30}

    expiry-sweep-ms: ${MARKETPLACE_SIGNUP_EXPIRY_SWEEP_MS:900000}

  booking:
    # The link in a confirmation email is what a consumer has instead of an
    # account (ADR 0014), so this key is what stands between a stranger and
    # somebody else's appointment. There is no default on purpose: a shipped
    # constant would make every deployment that forgot to set it forgeable by
    # anyone who had read this repository.
    #
    # Blank generates one per process and says so loudly at startup. That keeps
    # a developer machine working and makes the cost visible -- every link
    # already emailed stops verifying at the next restart.
    link-secret: ${MARKETPLACE_BOOKING_LINK_SECRET:}

    # How long before the appointment cancelling still returns the money.
    # Copied onto each booking as it is sold, so changing this affects what is
    # sold next rather than what was already agreed.
    cancellation-cutoff-hours: ${MARKETPLACE_BOOKING_CANCELLATION_CUTOFF_HOURS:24}

    # Per hour, per source. Not defending the token -- that is an HMAC and
    # guessing it is not a strategy -- but the endpoint is anonymous and does a
    # join per call. High enough that a customer refreshing the page while they
    # think about it never notices.
    lookup-per-ip-per-hour: ${MARKETPLACE_BOOKING_LOOKUP_PER_IP_PER_HOUR:120}

  console:
    # Sign-in attempts per hour from one source address, counted before the
    # password is checked -- verifying one is deliberately slow, and that
    # slowness is what an unlimited login endpoint sells cheaply.
    #
    # Higher than the signup limits because this one refuses a real person
    # rather than a form: a front desk with four staff behind one connection,
    # a session that expired, a password being hunted for in a drawer. A guess
    # worth making needs thousands, so there is a lot of room between the two.
    #
    # There is deliberately no per-address limit to go with it. See
    # LoginAttempts: refusing before the password is checked cannot tell an
    # owner from someone guessing at them, which makes a per-account bucket a
    # lockout anyone can trigger against any salon whose email they know.
    login-per-ip-per-hour: ${MARKETPLACE_CONSOLE_LOGIN_PER_IP_PER_HOUR:30}

  # Agents. Off, and that is the default a deployment has to override
  # deliberately -- this is the first dependency billed per request rather than
  # per month, sitting in front of the endpoint customers hit most. Same
  # reasoning as geocoding.provider below, with an invoice instead of a usage
  # policy. See ADR 0012 for what an agent is allowed to decide, which is a
  # much shorter list than what it is capable of.
  ai:
    enabled: ${MARKETPLACE_AI_ENABLED:false}

    # Blank accepts embabel.models.default-llm. Named separately because query
    # interpretation is extraction rather than judgement and runs on the search
    # path, so it is the one place where the cheapest capable model is not a
    # compromise.
    interpretation-model: ${MARKETPLACE_AI_INTERPRETATION_MODEL:}

    # A search box is not a text area. Longer arrivals are answered with the
    # plain geo query rather than sent to a model.
    max-query-length: ${MARKETPLACE_AI_MAX_QUERY_LENGTH:200}

    # Interpreted searches per hour, per source address. Much higher than the
    # signup limits and deliberately so: those defend accounts at Cal and
    # Stripe, where being wrong is not ours to undo, and this defends an
    # invoice. Being over it is not a lockout -- the search still runs, just
    # without the sentence having been read -- so it can afford to be generous
    # to an office or a carrier NAT sharing one address.
    ask-per-ip-per-hour: ${MARKETPLACE_AI_ASK_PER_IP_PER_HOUR:60}

    # How many category slugs go into the prompt, most-used first. The column is
    # free text with no reference table, so this is a bound on a list nobody
    # controls.
    vocabulary-limit: ${MARKETPLACE_AI_VOCABULARY_LIMIT:200}

  # Shared by every module that limits something. The sweep is here rather than
  # under whichever module happened to need a counter first.
  ratelimit:
    sweep-ms: ${MARKETPLACE_RATELIMIT_SWEEP_MS:3600000}

  vehicles:
    # Which registry answers "what car is ABC 123". 'none' by default: every
    # candidate is a contract and an API key, and the bil & däck vertical
    # (ADR 0015) works without one -- bookings carry the plate the customer
    # typed and the workshop reads it. When a vendor is chosen it is one
    # adapter behind VehicleRegistryPort and one value here.
    registry: ${MARKETPLACE_VEHICLES_REGISTRY:none}

    # 'tic' -- The Intelligence Company, a mirror of Transportstyrelsen's
    # register with the tyre dimensions, which is the field that made it
    # worth choosing. One endpoint, one header. The plan is metered (60 a
    # minute, 3 000 a month on the entry tier), and the sweep's batch size
    # and interval above are what keep a busy December inside it.
    tic:
      base-url: ${MARKETPLACE_VEHICLES_TIC_URL:https://api.tic.io}
      # Never in the URL. TIC accepts ?key= and says in its own docs that
      # it ends up in every log between here and there; the header does not.
      api-key: ${MARKETPLACE_VEHICLES_TIC_API_KEY:}
      timeout-seconds: ${MARKETPLACE_VEHICLES_TIC_TIMEOUT_SECONDS:10}

    # Bounded retry, as for geocoding: a plate the registry does not know is
    # almost always a typo, and a typo is not fixed by asking a fourth time.
    max-attempts: ${MARKETPLACE_VEHICLES_MAX_ATTEMPTS:3}
    batch-size: ${MARKETPLACE_VEHICLES_BATCH_SIZE:20}
    interval-ms: ${MARKETPLACE_VEHICLES_INTERVAL_MS:300000}

    # The cache in front of the registry (ADR 0016). A found car is trusted
    # for a year -- tyres and plates change hands -- and "not known" for a
    # month, because new cars are registered every day.
    cache:
      known-days: ${MARKETPLACE_VEHICLES_CACHE_KNOWN_DAYS:365}
      unknown-days: ${MARKETPLACE_VEHICLES_CACHE_UNKNOWN_DAYS:30}

    # GET /api/vehicles/{plate} is a paid call behind a free URL. Thirty an
    # hour is more cars than a household owns and fewer than a script wants.
    lookups-per-ip-per-hour: ${MARKETPLACE_VEHICLES_LOOKUPS_PER_IP_PER_HOUR:30}
    retry-after-seconds: ${MARKETPLACE_VEHICLES_RETRY_AFTER_SECONDS:60}

  reviews:
    # "Hur var det?" goes out this long after the appointment ended -- not
    # at once, since someone still in the chair cannot rate the cut -- and
    # never for a visit older than this many days, which would be spam
    # about something they have forgotten.
    ask-after-hours: ${MARKETPLACE_REVIEWS_ASK_AFTER_HOURS:2}
    ask-within-days: ${MARKETPLACE_REVIEWS_ASK_WITHIN_DAYS:14}
    batch-size: ${MARKETPLACE_REVIEWS_BATCH_SIZE:50}
    interval-ms: ${MARKETPLACE_REVIEWS_INTERVAL_MS:600000}

  geocoding:
    # 'none' by default, and that is not laziness. Enabling a geocoder by
    # default would point every developer machine and every CI run at a public
    # service with a strict usage policy, from an application whose entire job
    # is to submit addresses to it. Opting in is one line; being silently
    # blocked for bulk geocoding is not something to discover in production.
    provider: ${MARKETPLACE_GEOCODING_PROVIDER:none}

    nominatim:
      # The public OpenStreetMap instance. Fine for development and for a
      # handful of salons a day; its policy is an absolute maximum of one
      # request per second and no bulk geocoding. Point this at a self-hosted
      # instance before that stops being true -- the data is ODbL and the
      # container is well travelled.
      base-url: ${MARKETPLACE_GEOCODING_NOMINATIM_URL:https://nominatim.openstreetmap.org}

      # Required by the usage policy, and required to identify this application
      # rather than the HTTP library. A default Java user agent is what gets an
      # address blocked.
      user-agent: ${MARKETPLACE_GEOCODING_USER_AGENT:booking-marketplace/0.1 (+http://localhost:8090)}

      timeout-seconds: ${MARKETPLACE_GEOCODING_TIMEOUT_SECONDS:10}

    # How many times one address is asked about before it becomes an operator's
    # problem. Low on purpose: a refusal almost always means the address cannot
    # be matched at all -- an apartment number, a new building, a typo -- and
    # none of those are fixed by asking a fourth time.
    max-attempts: ${MARKETPLACE_GEOCODING_MAX_ATTEMPTS:3}

    # Small batches, spaced. A backlog is worked off across several passes
    # rather than in one burst against someone else's rate limit.
    batch-size: ${MARKETPLACE_GEOCODING_BATCH_SIZE:5}
    pause-ms: ${MARKETPLACE_GEOCODING_PAUSE_MS:1200}
    interval-ms: ${MARKETPLACE_GEOCODING_INTERVAL_MS:300000}

    # Long enough that startup, migrations and the first reconcile are done
    # before this competes for the scheduler.
    initial-delay-ms: ${MARKETPLACE_GEOCODING_INITIAL_DELAY_MS:20000}

  checkout:
    # Nobody sends a webhook for a customer who simply walked away, so this is
    # what returns their slot. Errs long: reselling a slot someone has just paid
    # for is far worse than holding one a few minutes too many.
    abandon-after-seconds: ${MARKETPLACE_CHECKOUT_ABANDON_AFTER_SECONDS:900}
    sweep-interval-ms: ${MARKETPLACE_CHECKOUT_SWEEP_INTERVAL_MS:60000}

server:
  port: 8090

logging:
  level:
    se.marketplace: DEBUG

# The agent platform. Nothing here is read unless marketplace.ai.enabled is
# true, but the key has to be absent-safe regardless: a backend that will not
# start without an API key would make an optional feature a deployment
# requirement.
embabel:
  models:
    default-llm: ${MARKETPLACE_AI_DEFAULT_MODEL:claude-haiku-4-5}
