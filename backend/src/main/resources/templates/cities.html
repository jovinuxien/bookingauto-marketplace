<!doctype html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::content}, ~{::jsonld})}">
  <head>
    <th:block th:fragment="jsonld"></th:block>
  </head>
  <body>
    <div th:fragment="content">
      <h1 class="h3">Orter</h1>
      <p class="text-muted">Välj en ort för att se salonger med lediga tider.</p>

      <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between" th:each="city : ${cities}">
          <a th:href="'/frisor/' + ${city.slug}"
             th:text="${city.city}">Stockholm</a>
          <span class="text-muted small" th:text="${city.providers} + ' salonger'">3 salonger</span>
        </li>
      </ul>
    </div>
  </body>
</html>
