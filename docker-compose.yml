##
## Local stack for the booking marketplace.
##
##   docker compose up -d
##
## Ports are deliberately unusual: 5432, 5433 and 6379 are already taken on this
## machine by other work, so nothing here can collide with it.
##
## Two databases on purpose. Cal owns scheduling; the marketplace owns
## everything else. Sharing one database would make it far too easy to write
## availability from both sides, which is the one thing that must never happen.
##

services:
  # ---------------------------------------------------------------- cal.diy --
  # The scheduling engine. Source of truth for whether a slot is free.
  #
  # Cal.com Inc. explicitly does not support Docker — the image and compose
  # setup are community maintained. Fine for local development; for production
  # decide deliberately between building from source and running the image.
  cal-db:
    image: postgres:16
    container_name: bm-cal-db
    environment:
      POSTGRES_USER: cal
      POSTGRES_PASSWORD: ${CAL_DB_PASSWORD:?set CAL_DB_PASSWORD in .env}
      POSTGRES_DB: calendso
    ports:
      - "5442:5432"
    volumes:
      - cal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cal -d calendso"]
      interval: 10s
      timeout: 5s
      retries: 12

  cal:
    image: calcom/cal.com:v6.2.0
    container_name: bm-cal
    depends_on:
      cal-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cal:${CAL_DB_PASSWORD}@cal-db:5432/calendso
      DATABASE_DIRECT_URL: postgresql://cal:${CAL_DB_PASSWORD}@cal-db:5432/calendso
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY:?set CALENDSO_ENCRYPTION_KEY in .env}
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      NEXT_PUBLIC_LICENSE_CONSENT: "agree"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/auth/login > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ----------------------------------------------------------- marketplace --
  # Providers, consumers, reviews, money, and the availability index.
  #
  # PostGIS rather than plain Postgres: "near me" is the primary query of the
  # entire product, and bolting geo on later means reindexing everything.
  market-db:
    image: postgis/postgis:16-3.4
    container_name: bm-market-db
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${MARKET_DB_PASSWORD:?set MARKET_DB_PASSWORD in .env}
      POSTGRES_DB: marketplace
    ports:
      - "5443:5432"
    volumes:
      - market-db:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d marketplace"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ------------------------------------------------------------- cal api-v2 --
  # Cal's authenticated REST API, as a separate service.
  #
  # This exists for one reason: the web image serves a PUBLIC booking-create
  # endpoint but no authenticated confirm or cancel. A funnel that can reserve
  # and cannot take it back strands a pending booking on every failed payment,
  # blocking a real slot with no automated way to release it.
  #
  # No image is published for it, so it must be built first:
  #   ./docker/build-api-v2.sh
  #
  # Pinned to the same version as the web image. They share one database and one
  # schema; a version mismatch is a migration skew between two things that
  # cannot be allowed to disagree.
  cal-api:
    image: bm/cal-api-v2:v6.2.0
    container_name: bm-cal-api
    depends_on:
      cal-db:
        condition: service_healthy
      cal-redis:
        condition: service_started
    environment:
      NODE_ENV: production
      API_PORT: "5555"
      API_URL: http://localhost
      DATABASE_URL: postgresql://cal:${CAL_DB_PASSWORD}@cal-db:5432/calendso
      DATABASE_DIRECT_URL: postgresql://cal:${CAL_DB_PASSWORD}@cal-db:5432/calendso
      DATABASE_READ_URL: postgresql://cal:${CAL_DB_PASSWORD}@cal-db:5432/calendso
      DATABASE_WRITE_URL: postgresql://cal:${CAL_DB_PASSWORD}@cal-db:5432/calendso
      # Must match the web app's, or tokens minted by one are rejected by the
      # other.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY:?set CALENDSO_ENCRYPTION_KEY in .env}
      JWT_SECRET: ${NEXTAUTH_SECRET}
      REDIS_URL: redis://cal-redis:6379
      WEB_APP_URL: http://localhost:3000
      # Team billing off: it is a Stripe-backed feature we do not use, and
      # leaving it on makes the service demand credentials at boot.
      IS_TEAM_BILLING_ENABLED: "false"
      STRIPE_API_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
    ports:
      - "3001:5555"

  # Required by api-v2 for caching. Separate from anything the marketplace does.
  cal-redis:
    image: redis:7-alpine
    container_name: bm-cal-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # ------------------------------------------------------------ stripe-mock --
  # Stripe's own mock server. Answers the API with fixtures and validates
  # nothing about the business, so it proves our requests are well formed and
  # nothing else -- a green run here is not evidence that payments work.
  #
  # Worth having anyway: it catches wrong parameter names, wrong types and
  # missing required fields without needing credentials or a Stripe account.
  stripe-mock:
    image: stripe/stripe-mock:v0.202.0
    container_name: bm-stripe-mock
    ports:
      - "12111:12111"

  # ---------------------------------------------------------------- mailhog --
  # Catches outgoing mail instead of delivering it, with a web UI on :8026.
  # Host ports are shifted by one: 1025 and 8025 are already taken on this
  # machine, which is the same reason every other port here is unusual.
  #
  # Same reason stripe-mock is here: an SMTP path that has never actually spoken
  # to a mail server is a guess. This proves the wire format and the headers;
  # it says nothing about deliverability, which only a real provider can.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: bm-mailhog
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  cal-db:
  market-db:
